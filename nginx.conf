events {
    worker_connections 1024;
}

http {
    upstream security_backend {
        server security:3000;
    }

    upstream uploader_backend {
        server uploader:3001;
    }

    upstream minio_backend {
        server minio:9001;
    }

    server {
        listen 80;
        server_name _;

        # Security service
        location /auth {
            proxy_pass http://security_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Uploader service
        location /upload {
            # Forward auth check
            auth_request /auth-verify;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;

            proxy_pass http://uploader_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Role $user_role;
        }

        # Internal auth verification endpoint
        location = /auth-verify {
            internal;
            proxy_pass http://security_backend/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }

        # MinIO Console
        location /minio-console {
            proxy_pass http://minio_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "API Gateway is healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
