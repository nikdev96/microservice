version: '3.8'

services:
  # API Gateway / Load Balancer
  nginx:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - microservices
    depends_on:
      - security
      - uploader
      - minio

  # Security Service - аутентификация
  security:
    build: ./security-service
    container_name: security-service
    environment:
      - AUTH_SECRET=supersecretkey123
      - VALID_TOKEN=valid-token-12345
    networks:
      - microservices

  # Uploader Service - загрузка файлов
  uploader:
    build: ./uploader-service
    container_name: uploader-service
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=uploads
    depends_on:
      - minio
      - security
    networks:
      - microservices

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: minio-storage
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - microservices
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

networks:
  microservices:
    driver: bridge

volumes:
  minio-data:
